# IQ9 chrony — discipline CLOCK_REALTIME to the PC (interim NTP; PTP/5G master later).
# frames stamp host_epoch_ns = CLOCK_REALTIME, so tightening this tightens the frame clock.
server 192.168.99.1 iburst minpoll 4 maxpoll 6
# The Windows W32Time server advertises a large root dispersion (~8s from its loose
# internet sync) -> raise the accept limit so chrony doesn't reject it (same reason
# timesyncd needed RootDistanceMaxSec=30).
maxdistance 30.0
# Step the clock if it's off by >0.1s on any of the first 3 updates (kills the initial
# offset fast), then slew afterwards.
makestep 0.1 3
driftfile /var/lib/chrony/drift
rtcsync
