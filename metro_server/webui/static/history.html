<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History — Metro Camera Web UI</title>
<style>
  :root { --bg:#15171c; --panel:#1e2128; --ink:#e6e8ec; --mut:#9aa3b2;
          --acc:#4ea1ff; --line:#2c303a; --ok:#5fd08a; --warn:#e6c15f; --bad:#e46a6a;
          --cc:#b98cff; --mtf:#57d6d6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:14px; margin:0; font-weight:600; }
  header a { color:var(--acc); text-decoration:none; font-size:13px; }
  header .right { margin-left:auto; color:var(--mut); font-size:12px; display:flex; gap:10px; align-items:center; }
  button { background:var(--acc); color:#08213d; border:0; border-radius:6px; padding:6px 10px; font-weight:600; cursor:pointer; font:inherit; }
  button.sec { background:#2a2f3a; color:var(--ink); }
  button.bad { background:#3a2a2f; color:var(--bad); }
  .wrap { padding:12px 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card .thumb { width:100%; height:150px; object-fit:cover; background:#0c0e12; border-bottom:1px solid var(--line); cursor:pointer; }
  .card .body { padding:9px 11px; display:flex; flex-direction:column; gap:6px; }
  .row1 { display:flex; align-items:center; gap:8px; }
  .badge { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:20px; }
  .badge.cc { background:rgba(185,140,255,.16); color:var(--cc); }
  .badge.mtf { background:rgba(87,214,214,.16); color:var(--mtf); }
  .ts { color:var(--mut); font-size:11.5px; margin-left:auto; }
  .metric { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .metric small { font-size:11px; color:var(--mut); font-weight:500; margin-left:5px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { background:#12141a; border:1px solid var(--line); border-radius:5px; padding:2px 7px; font-size:11px; color:var(--mut); font-variant-numeric:tabular-nums; }
  .chip b { color:var(--ink); font-weight:600; }
  .acts { display:flex; gap:6px; margin-top:2px; }
  .acts button { padding:5px 9px; font-size:12px; }
  .empty { color:var(--mut); padding:40px; text-align:center; }
  .flag { font-size:10.5px; }
  /* detail overlay */
  #modal { position:fixed; inset:0; background:rgba(6,8,12,.82); display:none; align-items:center; justify-content:center; padding:24px; z-index:10; }
  #modal.on { display:flex; }
  .sheet { background:var(--panel); border:1px solid var(--line); border-radius:12px; max-width:960px; width:100%; max-height:90vh; overflow:auto; padding:14px 16px; }
  .sheet img { width:100%; border-radius:8px; border:1px solid var(--line); background:#0c0e12; margin:8px 0; }
  .sheet h2 { margin:0 0 4px; font-size:15px; }
  pre { background:#12141a; border:1px solid var(--line); border-radius:6px; padding:8px 10px; overflow:auto; font-size:11.5px; color:var(--mut); max-height:280px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:12px; margin:6px 0; }
  .kv .k { color:var(--mut); } .kv .v { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>History</h1>
  <a href="/">live</a> <a href="/colorchecker">ColorChecker</a> <a href="/mtf">MTF</a>
  <div class="right"><span id="count"></span><button class="sec" id="refresh">Refresh</button></div>
</header>

<div class="wrap"><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">
  No saved measurements yet. Use <b>Save</b> on the ColorChecker or MTF page.</div></div>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $ = id => document.getElementById(id);
const fmt = (v,d=2) => (v==null||isNaN(v)) ? "–" : (+v).toFixed(d);

async function load(){
  let d;
  try { d = await (await fetch("/api/history")).json(); }
  catch(e){ $("grid").innerHTML = `<div class="empty">error: ${e.message}</div>`; return; }
  const b = d.bundles || [];
  $("count").textContent = `${b.length} saved · ${d.dir||""}`;
  $("empty").style.display = b.length ? "none" : "block";
  $("grid").innerHTML = b.map(card).join("");
}

function card(b){
  const s = b.summary || {};
  const thumb = `<img class="thumb" src="/api/history/thumb?stem=${encodeURIComponent(b.stem)}"
                  onerror="this.style.visibility='hidden'" onclick="detail('${b.stem}')" loading="lazy">`;
  let chips = "";
  if(b.kind==="colorchecker"){
    chips = `<span class="chip">vendor <b>${fmt(s.dE_vendor_mean)}</b></span>`
          + `<span class="chip">rootpoly d${s.rootpoly_degree||"?"} <b>${fmt(s.dE_rootpoly_xval_mean)}</b></span>`
          + (s.illuminant?`<span class="chip">${s.illuminant}</span>`:"")
          + (s.white_black_ratio?`<span class="chip">W:B <b>${fmt(s.white_black_ratio,0)}:1</b></span>`:"")
          + `<span class="chip flag" style="color:${s.derived_beats_vendor?'var(--ok)':'var(--warn)'}">${s.derived_beats_vendor?'derived beats vendor':'vendor better'}</span>`;
  } else {
    chips = `<span class="chip">${s.n_squares||0} sq · ${s.n_edges||0} edges</span>`
          + `<span class="chip">chan <b>${s.chan||"?"}</b></span>`
          + (s.nyquist?`<span class="chip">Nyq <b>${fmt(s.nyquist,0)}</b> ${s.units||""}</span>`:"");
  }
  chips += (b.has_raw?`<span class="chip flag" style="color:var(--acc)">+raw</span>`:"");
  const ml = b.metric_label||"", mv = fmt(b.metric, b.kind==="mtf"?2:2);
  return `<div class="card">
    ${thumb}
    <div class="body">
      <div class="row1"><span class="badge ${b.kind==='colorchecker'?'cc':'mtf'}">${b.kind==='colorchecker'?'ColorChecker':'MTF'}</span>
        <span class="ts">${b.timestamp||b.id}</span></div>
      <div class="metric">${mv}<small>${ml}</small></div>
      <div class="chips">${chips}</div>
      <div class="acts">
        <button class="sec" onclick="detail('${b.stem}')">Detail</button>
        <button class="sec" onclick="location.href='/api/history/download?stem=${encodeURIComponent(b.stem)}'">Download .h5</button>
        <button class="bad" onclick="del('${b.stem}')">Delete</button>
      </div>
    </div></div>`;
}

async function detail(stem){
  const b = await (await fetch("/api/history/item?stem="+encodeURIComponent(stem))).json();
  if(b.error){ alert(b.error); return; }
  const r = b.results||{}, m = b.meta||{};
  const kv = Object.entries(m).map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join("");
  $("sheet").innerHTML = `<h2>${b.kind} · ${b.timestamp}</h2>
    <div style="color:var(--mut);font-size:12px">${stem}${b.has_raw?" · raw included":""}${b.has_radiance?" · radiance included":""}</div>
    ${b.overlay?`<img src="${b.overlay}">`:""}
    ${kv?`<div class="kv">${kv}</div>`:""}
    <pre>${JSON.stringify(r,null,1)}</pre>
    <div class="acts"><button class="sec" onclick="location.href='/api/history/download?stem=${encodeURIComponent(stem)}'">Download .h5</button>
      <button class="sec" onclick="closeModal()">Close</button></div>`;
  $("modal").classList.add("on");
}
function closeModal(){ $("modal").classList.remove("on"); }
$("modal").onclick = e => { if(e.target===$("modal")) closeModal(); };

async function del(stem){
  if(!confirm("Move this bundle to .trash?\n"+stem)) return;
  await fetch("/api/history/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stem})});
  load();
}

$("refresh").onclick = load;
load();
</script>
</body>
</html>
